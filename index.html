<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Stock Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <h1>Shop Stock</h1>
        <p class="subtitle">Manage inventory easily from any device</p>
      </div>

      <!-- Stats Banner -->
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-label">Total Items</span>
          <span class="stat-value" id="totalItemsCount">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Total Units in Stock</span>
          <span class="stat-value" id="totalUnitsCount">0</span>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Add / Edit Stock Form Card -->
      <section class="card form-card">
        <div class="card-header">
          <h2 id="formTitle">Add New Stock</h2>
          <span id="editingBadge" class="editing-indicator" style="display: none;">Editing Mode</span>
        </div>

        <form id="stockForm" novalidate>
          <input type="hidden" id="editItemId" value="">

          <div class="form-group">
            <label for="itemName">Item Name <span class="required">*</span></label>
            <input 
              type="text" 
              id="itemName" 
              name="itemName" 
              placeholder="e.g. Cotton T-Shirt, Coffee Beans" 
              required
              autocomplete="off"
            >
            <span class="error-msg" id="itemNameError"></span>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="itemPrice">Price ($) <span class="required">*</span></label>
              <input 
                type="number" 
                id="itemPrice" 
                name="itemPrice" 
                placeholder="0.00" 
                step="0.01" 
                min="0"
                inputmode="decimal"
                required
              >
              <span class="error-msg" id="itemPriceError"></span>
            </div>

            <div class="form-group">
              <label for="itemQuantity">Units Left <span class="required">*</span></label>
              <input 
                type="number" 
                id="itemQuantity" 
                name="itemQuantity" 
                placeholder="0" 
                step="1" 
                min="0"
                inputmode="numeric"
                required
              >
              <span class="error-msg" id="itemQuantityError"></span>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" id="submitBtn" class="btn btn-primary">
              <span id="submitBtnText">Add Stock</span>
            </button>
            <button type="button" id="cancelEditBtn" class="btn btn-secondary" style="display: none;">
              Cancel Edit
            </button>
          </div>
        </form>
      </section>

      <!-- Inventory Section -->
      <section class="card list-card">
        <div class="list-toolbar">
          <h2>Current Stock</h2>
          
          <!-- Search Input -->
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
              <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
            </svg>
            <input 
              type="text" 
              id="searchInput" 
              placeholder="Search items by name..." 
              autocomplete="off"
            >
            <button type="button" id="clearSearchBtn" class="clear-search-btn" title="Clear search" style="display: none;">
              &times;
            </button>
          </div>
        </div>

        <!-- Stock Items Container -->
        <div id="stockListContainer" class="stock-list">
          <!-- Dynamically populated via script.js -->
        </div>

        <!-- Empty State Container -->
        <div id="emptyState" class="empty-state" style="display: none;">
          <div class="empty-icon">📦</div>
          <h3 id="emptyStateTitle">No stock items yet</h3>
          <p id="emptyStateMessage">Add your first item using the form above to start tracking your stock.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
